apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-backend
  namespace: inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-backend
  template:
    metadata:
      labels:
        app: inventory-backend
        monitoring: inventory
    spec:
      containers:
        - name: backend
          image: inventory-backend:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: "postgresql://inventory_user:inventory_pass@inventory-postgres:5432/inventory_db"
            - name: JWT_SECRET
              value: "inventory-devops-secret"
            - name: PORT
              value: "5000"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-backend
  namespace: inventory
  labels:
    monitoring: inventory
spec:
  selector:
    app: inventory-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  type: ClusterIP
